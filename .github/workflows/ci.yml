name: CI tests

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 7 * * *'  # Runs daily at 07:00 UTC.
  pull_request:
  push:
    branches: ["master"]

# Cancel in-progress workflows on PR updates; never cancel master pushes.
# https://docs.github.com/en/enterprise-cloud@latest/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'heads/master') }}

# Default minimal permissions for all jobs; individual steps may opt-in to more.
permissions:
  contents: read

env:
  PRIMARY_JDK: "21"
  USE_BAZEL_VERSION: "9.3.3"
  # Pinned pre-release JDK build, from jdk.java.net. Renovate bumps JDK_EA_BUILD;
  # JDK_EA_MAJOR changes by hand when the next feature release opens.
  JDK_EA_MAJOR: "28"
  JDK_EA_BUILD: "26"

jobs:
  # All Linux test suites across all supported JDKs in a single parallel matrix.
  linux-tests:
    name: ${{ matrix.script }} on JDK ${{ matrix.java.version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        include:
          # --- Core tests on Primary JDK 21 ---
          - {script: 'cftests-junit-part1', java: {version: '21', experimental: false}}
          - {script: 'cftests-junit-part2', java: {version: '21', experimental: false}}
          - {script: 'cftests-nonjunit', java: {version: '21', experimental: false}}
          # --- Downstream integration tests on Primary JDK 21 ---
          - {script: 'typecheck-part1', java: {version: '21', experimental: false}}
          - {script: 'typecheck-part2', java: {version: '21', experimental: false}}
          - {script: 'guava', java: {version: '21', experimental: false}}
          - {script: 'plume-lib', java: {version: '21', experimental: false}}
          - {script: 'daikon-part1', java: {version: '21', experimental: false}}
          - {script: 'daikon-part2', java: {version: '21', experimental: false}}
          - {script: 'daikon-part3', java: {version: '21', experimental: false}}
          - {script: 'jspecify-conformance', java: {version: '21', experimental: false}}
          - {script: 'jspecify-reference-checker', java: {version: '21', experimental: false}}
          - {script: 'templatefora-checker', java: {version: '21', experimental: false}}
          - {script: 'misc', java: {version: '21', experimental: false}}
          # The release build, without credentials and without publishing.
          - {script: 'release', java: {version: '21', experimental: false}}
          # --- JDK 8 ---
          - {script: 'cftests-junit-part1', java: {version: '8', experimental: false}}
          - {script: 'cftests-junit-part2', java: {version: '8', experimental: false}}
          - {script: 'cftests-nonjunit', java: {version: '8', experimental: false}}
          - {script: 'typecheck-part1', java: {version: '8', experimental: false}}
          - {script: 'typecheck-part2', java: {version: '8', experimental: false}}
          - {script: 'guava', java: {version: '8', experimental: false}}
          - {script: 'cftests-junit-jdk21', java: {version: '8', experimental: false}}
          # --- JDK 28 (experimental) ---
          - {script: 'cftests-junit-part1', java: {version: '28', experimental: true}}
          - {script: 'cftests-junit-part2', java: {version: '28', experimental: true}}
          - {script: 'cftests-nonjunit', java: {version: '28', experimental: true}}
          - {script: 'cftests-junit-jdk21', java: {version: '28', experimental: true}}
          # --- JDK 27 ---
          - {script: 'cftests-junit-part1', java: {version: '27', experimental: false}}
          - {script: 'cftests-junit-part2', java: {version: '27', experimental: false}}
          - {script: 'cftests-nonjunit', java: {version: '27', experimental: false}}
          - {script: 'cftests-junit-jdk21', java: {version: '27', experimental: false}}
          - {script: 'typecheck-part1', java: {version: '27', experimental: false}}
          - {script: 'typecheck-part2', java: {version: '27', experimental: false}}
          - {script: 'guava', java: {version: '27', experimental: false}}
          - {script: 'plume-lib', java: {version: '27', experimental: false}}
          - {script: 'misc', java: {version: '27', experimental: false}}
          - {script: 'jspecify-conformance', java: {version: '27', experimental: false}}
          - {script: 'jspecify-reference-checker', java: {version: '27', experimental: false}}
          - {script: 'templatefora-checker', java: {version: '27', experimental: false}}
          # --- JDK 25 ---
          - {script: 'cftests-junit-part1', java: {version: '25', experimental: false}}
          - {script: 'cftests-junit-part2', java: {version: '25', experimental: false}}
          - {script: 'cftests-nonjunit', java: {version: '25', experimental: false}}
          - {script: 'cftests-junit-jdk21', java: {version: '25', experimental: false}}
          # --- JDK 17 ---
          - {script: 'cftests-junit-part1', java: {version: '17', experimental: false}}
          - {script: 'cftests-junit-part2', java: {version: '17', experimental: false}}
          - {script: 'cftests-nonjunit', java: {version: '17', experimental: false}}
          - {script: 'cftests-junit-jdk21', java: {version: '17', experimental: false}}
          - {script: 'cftests-ajavachecks', java: {version: '17', experimental: false}}
          - {script: 'daikon-part1', java: {version: '17', experimental: false}}
          - {script: 'daikon-part2', java: {version: '17', experimental: false}}
          - {script: 'daikon-part3', java: {version: '17', experimental: false}}
          # --- JDK 11 ---
          - {script: 'cftests-junit-part1', java: {version: '11', experimental: false}}
          - {script: 'cftests-junit-part2', java: {version: '11', experimental: false}}
          - {script: 'cftests-nonjunit', java: {version: '11', experimental: false}}
          - {script: 'cftests-junit-jdk21', java: {version: '11', experimental: false}}
    continue-on-error: ${{ matrix.java.experimental }}
    steps:
      # `misc` runs `ci-diff` which needs full history; everything else is shallow.
      - uses: actions/checkout@v7
        if: ${{ matrix.script == 'misc' }}
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        if: ${{ matrix.script != 'misc' }}
        with:
          fetch-depth: 1

      - name: Set up test environment
        # Setup normally takes 1-5 minutes; one that takes 15 is stuck (apt, cache restore), so fail it early.
        timeout-minutes: 15
        uses: ./.github/actions/setup-test-env
        with:
          primary-jdk: ${{ env.PRIMARY_JDK }}
          target-jdk: ${{ matrix.java.version }}
          jdk-ea-major: ${{ env.JDK_EA_MAJOR }}
          jdk-ea-build: ${{ env.JDK_EA_BUILD }}
          script: ${{ matrix.script }}
          # Only master writes caches, which pull requests then read.  A pull request's own
          # entries help only its reruns, and they push master's entries out of the cache.
          # On master, only one job per JDK writes the Gradle cache; the other jobs on that JDK
          # read it.  An entry from every job overflowed the repository's 10 GB cache limit.
          cache-read-only: ${{ github.ref != 'refs/heads/master' || matrix.script != 'cftests-junit-part1' }}

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh
        env:
          ORG_GRADLE_PROJECT_useJdkVersion: ${{ matrix.java.version }}
          JAVA_VERSION: ${{ matrix.java.version }}
          # The release scripts and the web site generator query the GitHub API, which limits
          # requests without a token.
          GITHUB_TOKEN: ${{ matrix.script == 'release' && github.token || '' }}

      # The zip files that test-release.sh built, for the nightly-zips job of the scheduled run.
      - name: Keep the zip files for the nightly build
        if: ${{ github.event_name == 'schedule' && matrix.script == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-zips
          path: |
            build/checker-framework-*.zip
            build/annotation-file-utilities-*.zip
          if-no-files-found: error
          retention-days: 1

      # What the job downloaded instead of restoring it from a cache.
      - name: List the downloaded files
        if: ${{ !cancelled() }}
        run: ./checker/bin-devel/list-downloads.sh "$RUNNER_TEMP/downloads-marker"

  # Tests of the platform-dependent code on Windows and macOS; see test-otheros.sh.  One job per
  # operating system, as macOS runners are often not available.
  otheros:
    name: ${{ matrix.script }} on JDK ${{ matrix.java_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'macos-latest']
        script: ['otheros']
        java_version: [21]
    env:
      JAVA_VERSION: ${{ matrix.java_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java_version }}
        timeout-minutes: 10
        uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'

      # As in setup-test-env.
      - name: Remove the javac problem matchers
        shell: bash
        run: |
          echo "::remove-matcher owner=javac::"
          echo "::remove-matcher owner=maven-javac::"

      # After setup-java, which writes its own ~/.m2/settings.xml.
      - name: Use Google's mirror of Maven Central
        uses: ./.github/actions/maven-central-mirror

      - name: Setup Gradle
        timeout-minutes: 10
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # As for linux-tests, one job per operating system writes the cache.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Install coreutils on macOS
        if: ${{ matrix.os == 'macos-latest' }}
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install coreutils

      - name: Install wget on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        timeout-minutes: 10
        run: choco install wget --no-progress

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}
        shell: bash
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh

  # Build the jars that a release ships and attach them to the run, so that a
  # branch can be tried out without building it.  Not gated on the test jobs:
  # the jars of a branch whose tests fail are exactly the ones a bug report
  # wants to attach.
  dev-jars:
    name: Development jars
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up test environment
        timeout-minutes: 15
        uses: ./.github/actions/setup-test-env
        with:
          primary-jdk: ${{ env.PRIMARY_JDK }}
          target-jdk: ${{ env.PRIMARY_JDK }}
          jdk-ea-major: ${{ env.JDK_EA_MAJOR }}
          jdk-ea-build: ${{ env.JDK_EA_BUILD }}
          # Reads the cache that cftests-junit-part1 on the same JDK writes.
          cache-read-only: 'true'

      - name: Build the jars
        run: ./gradlew assembleForJavac

      - uses: actions/upload-artifact@v7
        with:
          name: checker-framework-jars
          path: checker/dist/*.jar
          if-no-files-found: error
          retention-days: 30

  # Attach the zip files of master to the "nightly" prerelease, replacing those of the previous
  # night.  The web site's generator publishes them as the development version of the web site,
  # https://eisop.github.io/cf/dev/, so that problems in the manual and the zip files show up
  # before a release.  Only the scheduled run, and only when its tests pass, so the development
  # version is a master that passed CI.  Not gated on otheros: GitHub cancels its macOS job on
  # about half of the scheduled runs for lack of runners.
  #
  # The prerelease is never the latest release: GitHub's "latest release", which the release
  # scripts and the web site use, excludes prereleases.  It is updated in place rather than
  # recreated, because creating a release notifies everyone who watches the repository's releases.
  nightly-zips:
    name: Nightly build
    needs: linux-tests
    if: ${{ github.event_name == 'schedule' && github.repository == 'eisop/checker-framework' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # To move the tag and to replace the files of the prerelease.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # gh works on this repository without a checkout.
      GH_REPO: ${{ github.repository }}
      TAG: nightly
    steps:
      - name: Check whether master changed since the last nightly build
        id: check
        run: |
          # gh prints the error response on stdout when there is no tag yet.
          built=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha 2> /dev/null) || built=""
          echo "master: $GITHUB_SHA; last nightly build: ${built:-none}"
          if [ "$built" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "master has not changed since the last nightly build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: ${{ steps.check.outputs.changed == 'true' }}
        with:
          name: nightly-zips
          path: zips

      - name: Attach the zip files to the prerelease
        if: ${{ steps.check.outputs.changed == 'true' }}
        run: |
          files=(zips/checker-framework-*.zip zips/annotation-file-utilities-*.zip)
          notes="The zip files of master at $GITHUB_SHA, built $(date -u +%Y-%m-%d) by the scheduled CI run.  Not a release."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false --title "Nightly build" --notes "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false --title "Nightly build" --notes "$notes"
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          # Remove the files of earlier versions, whose names differ.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in $assets; do
            case " ${files[*]##*/} " in
              *" $asset "*) ;;
              *) gh release delete-asset "$TAG" "$asset" --yes ;;
            esac
          done
          # Last, so that a failed upload is retried the next night.  gh release create made the
          # tag; deleting it by hand turns the release into a draft, and the tag is made again.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true \
            || gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
