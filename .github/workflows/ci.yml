name: CI tests

on:
  schedule:
    - cron: '0 7 * * *'  # Runs daily at 07:00 UTC.
  pull_request:
  push:
    branches: [ "master" ]

# Cancel in-progress workflows on PR updates; never cancel master pushes.
# https://docs.github.com/en/enterprise-cloud@latest/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'heads/master') }}

# Default minimal permissions for all jobs; individual steps may opt-in to more.
permissions:
  contents: read

env:
  PRIMARY_JDK: "21"
  USE_BAZEL_VERSION: "9.2.0"
  # Pinned pre-release JDK build, from jdk.java.net. Renovate bumps JDK_EA_BUILD;
  # JDK_EA_MAJOR changes by hand when the next feature release opens.
  JDK_EA_MAJOR: "27"
  JDK_EA_BUILD: "35"

jobs:
  # Basic sanity tests on the primary JDK.
  sanity:
    name: ${{ matrix.script }} on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        script: ['cftests-junit', 'cftests-nonjunit']
        # env.PRIMARY_JDK is not available in strategy.matrix or in
        # jobs.<id>.name / jobs.<id>.env, so the primary JDK is repeated here.
        java_version: [21]
    env:
      JAVA_VERSION: ${{ matrix.java_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'
          # Caching handled by gradle/actions/setup-gradle below.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          # Allow cache writes on PR runs so subsequent reruns on the same PR
          # restore the previous run's Gradle home instead of rebuilding from
          # scratch.
          cache-read-only: false

      - name: Setup Bazel
        if: ${{ matrix.script == 'cftests-nonjunit' }}
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh

  # Remaining tests on the primary JDK. Runs in parallel with `sanity` for throughput.
  remainder:
    name: ${{ matrix.script }} on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # No need to run 'cftests-junit-jdk21' on JDK 21.
        script:
          - 'typecheck-part1'
          - 'typecheck-part2'
          - 'guava'
          - 'plume-lib'
          - 'daikon-part1'
          - 'daikon-part2'
          - 'jspecify-conformance'
          - 'jspecify-reference-checker'
          - 'templatefora-checker'
          - 'misc'
        # Keep in sync with env.PRIMARY_JDK.
        java_version: [21]
    env:
      JAVA_VERSION: ${{ matrix.java_version }}
    steps:
      # `misc` runs `ci-diff` which needs full history; everything else is shallow.
      - uses: actions/checkout@v7
        if: ${{ matrix.script == 'misc' }}
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        if: ${{ matrix.script != 'misc' }}
        with:
          fetch-depth: 1

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: false

      - name: Set up misc test dependencies
        if: ${{ matrix.script == 'misc' }}
        uses: ./.github/actions/setup-misc

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh

  core-jdks:
    name: ${{ matrix.script }} on JDK ${{ matrix.java.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [sanity, remainder]
    env:
      JAVA_VERSION: ${{ matrix.java.version }}
    strategy:
      # `continue-on-error` below prevents experimental JDK failures from
      # triggering fail-fast cancellation of the rest of the matrix.
      fail-fast: true
      matrix:
        script:
          - 'cftests-junit'
          - 'cftests-nonjunit'
          - 'cftests-junit-jdk21'
        # Keep all LTS versions plus the newest non-LTS version.
        # Experimental versions use the $version compiler but run Gradle on the primary JDK.
        # Keep $version values in sync with env.JDK_EA_MAJOR above;
        # env context is not available in strategy.matrix.
        java:
          - {version: '27', experimental: true}
          - {version: '26', experimental: false}
          - {version: '25', experimental: false}
          - {version: '17', experimental: false}
          - {version: '11', experimental: false}
          - {version: '8',  experimental: false}
        exclude:
          # JDK 8 does not allow toolchains, so 'cftests-junit-jdk21' is unnecessary.
          - {script: 'cftests-junit-jdk21', java: {version: '8'}}
    continue-on-error: ${{ matrix.java.experimental }}
    steps:
      - name: Check out sources (shallow)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK ${{ env.PRIMARY_JDK }} for Gradle to run on
        uses: actions/setup-java@v6.0.0
        with:
          # Install the primary JDK first, to make it available to Gradle via gradle.properties below.
          java-version: ${{ env.PRIMARY_JDK }}
          distribution: 'zulu'

      - name: Set up stable JDK ${{ matrix.java.version }}
        if: ${{ matrix.java.version != env.JDK_EA_MAJOR }}
        uses: actions/setup-java@v6.0.0
        with:
          # Install the requested JDK second, to make it the default on which tests run.
          java-version: ${{ matrix.java.version }}
          distribution: 'zulu'

      # A pre-release build lives on one of two download paths, depending on how
      # far through its release cycle it is, so resolve the pinned build against
      # both rather than assuming either.
      #
      # Do not replace this with `website:`/`release:`/`version:`, which lets
      # `oracle-actions/setup-java` resolve the build. Passing a build-specific
      # `version: 27-ea+NN` (what #1620 replaced) fails with `No URI mapped for
      # key` as soon as a newer build lands, because that action's mapping lists
      # only the current build. Passing no version tracks whatever build is
      # current, which is what the pin exists to prevent.
      - name: Resolve pinned JDK ${{ env.JDK_EA_MAJOR }} build ${{ env.JDK_EA_BUILD }}
        id: ea-jdk
        if: ${{ matrix.java.version == env.JDK_EA_MAJOR }}
        env:
          MAJOR: ${{ env.JDK_EA_MAJOR }}
          BUILD: ${{ env.JDK_EA_BUILD }}
        run: |
          ea="https://download.java.net/java/early_access/jdk${MAJOR}/${BUILD}/GPL/openjdk-${MAJOR}-ea+${BUILD}_linux-x64_bin.tar.gz"
          if curl -sfI "$ea" > /dev/null; then
            # Early-access builds stay downloadable long after they stop being
            # current, so this covers the whole early-access phase.
            echo "Resolved build ${BUILD} on the early-access path."
            echo "uri=$ea" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Once a release reaches its release-candidate phase, its builds move to
          # a path containing a hash that the build number cannot yield, so read
          # the URI off the release page instead of constructing it.
          page="https://jdk.java.net/${MAJOR}/"
          pattern="https://download\.java\.net/java/GA/jdk${MAJOR}/[0-9a-f]+/[0-9]+/GPL/openjdk-${MAJOR}_linux-x64_bin\.tar\.gz"
          uri=$(curl -sf "$page" | grep -oE "$pattern" | sort -u | head -n 1) || true
          if [ -z "$uri" ]; then
            echo "::error::JDK ${MAJOR} build ${BUILD} is not on the early-access path, and ${page} lists no linux-x64 release-candidate archive. Check that page and update JDK_EA_MAJOR/JDK_EA_BUILD."
            exit 1
          fi
          # That page only ever shows the current build, so confirm it is the
          # pinned one instead of silently testing whatever has replaced it.
          found=$(printf '%s' "$uri" | sed -E 's#.*/[0-9a-f]+/([0-9]+)/GPL/.*#\1#')
          if [ "$found" != "$BUILD" ]; then
            echo "::error::Pinned JDK ${MAJOR} build ${BUILD} is no longer available: it is not on the early-access path, and ${page} now offers build ${found}. Superseded release-candidate builds are not retained, so set JDK_EA_BUILD to ${found}."
            exit 1
          fi
          echo "Resolved build ${BUILD} on the release-candidate path."
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Set up early-access JDK ${{ env.JDK_EA_MAJOR }}
        if: ${{ matrix.java.version == env.JDK_EA_MAJOR }}
        uses: oracle-actions/setup-java@v1
        with:
          # Resolved above; the action still verifies the archive's checksum.
          uri: ${{ steps.ea-jdk.outputs.uri }}
          install-as-version: ${{ env.JDK_EA_MAJOR }}

      - name: Pin Gradle to JDK ${{ env.PRIMARY_JDK }} via gradle.properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME_${{ env.PRIMARY_JDK }}_X64" >> ~/.gradle/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: false

      - name: Setup Bazel
        if: ${{ matrix.script == 'cftests-nonjunit' }}
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Output version information to debug CI
        run: which java && ./gradlew --version

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh
        env:
          # Tells Gradle which JDK version to compile/run tests against,
          # so we can e.g. run JDK 25 while Gradle itself does not support JDK 25 yet.
          ORG_GRADLE_PROJECT_useJdkVersion: ${{ matrix.java.version }}

  integration-jdks:
    name: ${{ matrix.script }} on JDK ${{ matrix.java.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [sanity, remainder]
    env:
      JAVA_VERSION: ${{ matrix.java.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # typecheck and guava on oldest core version (8) and newest stable (26)
          - {script: 'typecheck-part1', java: {version: '8'}}
          - {script: 'typecheck-part1', java: {version: '26'}}
          - {script: 'typecheck-part2', java: {version: '8'}}
          - {script: 'typecheck-part2', java: {version: '26'}}
          - {script: 'guava',           java: {version: '8'}}
          - {script: 'guava',           java: {version: '26'}}
          # plume-lib, misc, and jspecify tests only on newest stable (26)
          - {script: 'plume-lib',       java: {version: '26'}}
          - {script: 'misc',            java: {version: '26'}}
          - {script: 'jspecify-conformance', java: {version: '26'}}
          - {script: 'jspecify-reference-checker', java: {version: '26'}}
          - {script: 'templatefora-checker', java: {version: '26'}}
          # Daikon produces 'this-escape' warnings in JDK 22+. Only JDK 17.
          - {script: 'daikon-part1',    java: {version: '17'}}
          - {script: 'daikon-part2',    java: {version: '17'}}
    steps:
      - name: Check out sources (full history for misc)
        uses: actions/checkout@v7
        if: ${{ matrix.script == 'misc' }}
        with:
          fetch-depth: 0
      - name: Check out sources (shallow)
        uses: actions/checkout@v7
        if: ${{ matrix.script != 'misc' }}
        with:
          fetch-depth: 1

      - name: Set up JDK ${{ env.PRIMARY_JDK }} for Gradle to run on
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.PRIMARY_JDK }}
          distribution: 'zulu'

      - name: Set up stable JDK ${{ matrix.java.version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java.version }}
          distribution: 'zulu'

      - name: Pin Gradle to JDK ${{ env.PRIMARY_JDK }} via gradle.properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME_${{ env.PRIMARY_JDK }}_X64" >> ~/.gradle/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: false

      - name: Set up misc test dependencies
        if: ${{ matrix.script == 'misc' }}
        uses: ./.github/actions/setup-misc

      - name: Output version information to debug CI
        run: which java && ./gradlew --version

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh
        env:
          ORG_GRADLE_PROJECT_useJdkVersion: ${{ matrix.java.version }}

  # Sanity tests on Windows and macOS.
  otheros:
    name: ${{ matrix.script }} on JDK ${{ matrix.java_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: sanity
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'macos-latest']
        script: ['cftests-junit']
        java_version: [21]
    env:
      JAVA_VERSION: ${{ matrix.java_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: false

      - name: Install coreutils on macOS
        if: ${{ matrix.os == 'macos-latest' }}
        run: brew install coreutils

      - name: Install wget on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: choco install wget --no-progress

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}
        shell: bash
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh
