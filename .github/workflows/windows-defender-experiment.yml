# Experiment, not for merging: does excluding the build from Windows Defender's real-time
# scanning speed up the Windows JUnit job? Runs that job on the same commit with and without the
# exclusion, twice each.
name: Windows Defender experiment

on:  # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

jobs:
  junit:
    name: cftests-junit on Windows, exclusion=${{ matrix.exclusion }}, rep ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        exclusion: ['on', 'off']
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Report Defender state
        shell: pwsh
        run: Get-MpComputerStatus | Select-Object AMServiceEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled | Format-List

      - name: Exclude the build from Defender real-time scanning
        if: ${{ matrix.exclusion == 'on' }}
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.gradle", "$env:USERPROFILE\.m2", $env:RUNNER_TEMP, $env:TEMP, $env:RUNNER_TOOL_CACHE)
          Add-MpPreference -ExclusionPath $paths
          Add-MpPreference -ExclusionProcess @('java.exe', 'javac.exe', 'git.exe', 'bash.exe')
          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

      - name: Set up JDK 21
        timeout-minutes: 10
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup Gradle
        timeout-minutes: 10
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      - name: Install wget
        timeout-minutes: 10
        run: choco install wget --no-progress

      - name: Run test script checker/bin-devel/test-cftests-junit
        shell: bash
        env:
          JAVA_VERSION: 21
        run: ./checker/bin-devel/test-cftests-junit.sh
