name: Publish snapshot

# Publishes the current -SNAPSHOT version to the Central Portal snapshot
# repository, so consumers can track master without waiting for a release.
#
# Inert until the repository has the publishing secrets: the first job checks
# for SONATYPE_NEXUS_USERNAME and everything else is skipped when it is absent,
# so merging this file publishes nothing on its own.  See
# docs/developer/maven-central-publishing.md for the one-time setup.
#
# Snapshots are unsigned (gradle-mvn-push.gradle signs releases only), so no
# GPG key is needed here.

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 09:00 UTC, after the 07:00 CI run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  check-configured:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SONATYPE_NEXUS_USERNAME: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
        run: |
          if [ -n "$SONATYPE_NEXUS_USERNAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Publishing secrets are not set; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: check-configured
    if: needs.check-configured.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.3.0

      # Publishing a non-snapshot version from here would go to the release
      # repository and could not be undone, so refuse unless the version says
      # SNAPSHOT.
      - name: Verify the version is a snapshot
        run: |
          version=$(./gradlew -q :checker-qual:properties --no-configuration-cache \
              | awk '/^version:/ {print $2}')
          echo "version=$version"
          case "$version" in
            *SNAPSHOT) ;;
            *) echo "::error::Refusing to publish non-snapshot version $version"; exit 1 ;;
          esac

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_SONATYPE_NEXUS_USERNAME: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_SONATYPE_NEXUS_PASSWORD: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
        run: ./gradlew publish --no-parallel --no-configuration-cache
