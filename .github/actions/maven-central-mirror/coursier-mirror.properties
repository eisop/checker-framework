# Installed as ~/.config/coursier/mirror.properties by the maven-central-mirror action, which also
# sets COURSIER_MIRRORS to it; see maven-central-mirror.gradle.
# Coursier resolves the Maven dependencies of a Bazel build that uses rules_jvm_external, such as
# docs/examples/BazelExample. A Coursier mirror has no fallback, so an artifact that is not on
# Google's mirror yet cannot be downloaded.
central.from=https://repo1.maven.org/maven2;https://repo.maven.apache.org/maven2
central.to=https://maven-central.storage-download.googleapis.com/maven2
