name: 'Use Google''s mirror of Maven Central'
description: 'Makes Gradle, Maven, and Coursier download from Google''s mirror of Maven Central; Gradle and Maven fall back to Maven Central'

# Other repositories, such as eisop/jspecify-reference-checker, can use this action, too:
#   uses: eisop/checker-framework/.github/actions/maven-central-mirror@<ref>
# It replaces ~/.m2/settings.xml, so run it after actions/setup-java, which writes its own.

runs:
  using: composite
  steps:
    - name: Use Google's mirror of Maven Central
      shell: bash
      run: |
        mkdir -p ~/.gradle/init.d ~/.m2 ~/.config/coursier
        cp "$GITHUB_ACTION_PATH/maven-central-mirror.gradle" ~/.gradle/init.d/
        cp "$GITHUB_ACTION_PATH/maven-settings.xml" ~/.m2/settings.xml
        cp "$GITHUB_ACTION_PATH/coursier-mirror.properties" ~/.config/coursier/mirror.properties
        echo "COURSIER_MIRRORS=$HOME/.config/coursier/mirror.properties" >> "$GITHUB_ENV"
