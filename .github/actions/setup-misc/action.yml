name: 'Set up misc test dependencies'
description: >-
  Installs the apt and pip dependencies required by the `misc` test script,
  caching downloaded apt packages and pip downloads so subsequent runs avoid
  re-downloading the large texlive packages.

runs:
  using: composite
  steps:
    # The downloaded .deb files are specific to the Ubuntu release, so it is part of the cache keys.
    # With only `runner.os` in the key, a cache saved on Ubuntu 24.04 was restored on 26.04, where
    # apt could use almost none of it, and, as a cache entry is never replaced, stayed that way.
    - name: Identify the OS release
      id: os-release
      shell: bash
      run: echo "release=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")" >> "$GITHUB_OUTPUT"

    - name: Restore apt download cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/apt-archives
        # Cache invalidates when this file (the package list) changes.
        key: apt-misc-v1-${{ steps.os-release.outputs.release }}-${{ hashFiles('.github/actions/setup-misc/action.yml') }}
        restore-keys: |
          apt-misc-v1-${{ steps.os-release.outputs.release }}-

    - name: Install apt packages
      shell: bash
      run: |
        export DEBIAN_FRONTEND=noninteractive
        # apt needs both the cache dir and its `partial/` subdir to exist.
        mkdir -p ~/.cache/apt-archives/partial
        # A mirror that stalls has hung this step for an hour.  Bound each apt-get run,
        # and try it once more before failing.
        apt_get() {
          for attempt in 1 2; do
            if timeout 10m sudo -E apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              "$@"; then
              return 0
            fi
            [ "$attempt" = 2 ] && return 1
            sleep 30
          done
        }
        apt_get update
        apt_get install -y --fix-missing --no-install-recommends \
          -o Dir::Cache::Archives="$HOME/.cache/apt-archives" \
          dia \
          graphviz \
          hevea \
          latexmk \
          librsvg2-bin \
          pdf2svg \
          python3-pip \
          rsync \
          shellcheck \
          shfmt \
          texlive-base \
          texlive-font-utils \
          texlive-fonts-recommended \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-latex-recommended
        # `sudo apt-get` creates root-owned lock and partial/ files in the
        # cache dir, which would block actions/cache from saving it.
        sudo chown -R "$USER" ~/.cache/apt-archives

    - name: Restore pip download cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: pip-misc-v1-${{ steps.os-release.outputs.release }}-${{ hashFiles('.github/actions/setup-misc/action.yml') }}
        restore-keys: |
          pip-misc-v1-${{ steps.os-release.outputs.release }}-

    - name: Install uv and html5validator
      shell: bash
      # PEP 668: Ubuntu 24.04's system Python is externally-managed.
      # `--break-system-packages` is the documented escape hatch for CI.
      #
      # `make style-check` runs ruff, ty, pymarkdownlnt, html5validator, and
      # yamllint through uv.  The versions of ruff, ty, pymarkdownlnt, and
      # html5validator are locked in `uv.lock`, which keeps their results
      # reproducible across CI runs.  Bump them deliberately, with `uv lock
      # --upgrade-package <name>`, not as a side effect of an unrelated PR.
      #
      # The Gradle task `htmlValidate` runs the `html5validator` executable
      # directly, so it is also installed with pip.
      run: pip install --break-system-packages uv html5validator
