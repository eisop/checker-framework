plugins {
    id 'java-library'
    // Exposes src/testFixtures as a consumable feature so that the testchecker support library
    // (org.checkerframework.framework.testchecker.lib) is available to this project's own tests
    // and to :checker's tests via testFixtures(project(':framework')).
    id 'java-test-fixtures'
}

// allSourcesJar (below) reads project(':javacutil').sourceSets.main.allJava directly.
// javacutil is declared after framework in settings.gradle's include order, so without
// this, that access would run before javacutil's own build.gradle has had a chance to
// configure its sourceSets -- harmless today only because javacutil never customizes
// them, but not something Gradle guarantees. dataflow doesn't need the same guard: it's
// declared before framework already.
evaluationDependsOn(':javacutil')

ext {
    // Location of the annotated JDK clone, relative to this directory by default. Overridable
    // (-PannotatedJdkHome=/abs/path) so a build that needs this project's own default JDK
    // checkout to coexist with a *different* annotated JDK at the same conventional sibling
    // location (e.g. an external checker's own JDK fork, built via --include-build) can point
    // this at wherever eisop's own clone actually lives. See
    // checker/bin-devel/test-jspecify-reference-checker.sh for a caller that uses this.
    annotatedJdkHome = project.findProperty('annotatedJdkHome') ?: '../../jdk'
}

sourceSets {
    main {
        java {
            // NO-AFU
            exclude '**/org/checkerframework/common/wholeprograminference/**'
            exclude '**/org/checkerframework/framework/stub/AddAnnotatedFor.java'
            exclude '**/org/checkerframework/framework/stub/ToIndexFileConverter.java'
        }

        resources {
            // Stub files, message.properties, etc.
            srcDirs += [
                'src/main/java',
                layout.buildDirectory.dir('generated/resources')
            ]

            // NO-AFU
            exclude '**/org/checkerframework/common/wholeprograminference/**'
            exclude '**/org/checkerframework/framework/stub/AddAnnotatedFor.java'
            exclude '**/org/checkerframework/framework/stub/ToIndexFileConverter.java'
        }
    }
    testannotations {
        java {
            srcDirs = ['src/testannotations/java']
        }
    }
    stubifier
}

tasks.named('sourcesJar') {
    // The resources duplicate content from the src directory.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar') {
    // The resources duplicate content from the src directory.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    implementation.extendsFrom(stubifierImplementation)

    // Exposes the stubifier tool (JavaStubifier, BinaryStubWriter, BinaryStubFileGenerator)
    // together with its runtime dependencies, for the generateBinaryStubFiles tasks that the
    // top-level build file registers in subprojects containing .astub files. A consumable
    // configuration is required: resolving another project's sourceSets classpath directly is
    // incompatible with the configuration cache.
    stubifierTool {
        canBeConsumed = true
        canBeResolved = false
        extendsFrom(stubifierImplementation)
    }
}

// The stubifier classes themselves are the configuration's artifact.
sourceSets.stubifier.output.classesDirs.each { classesDir ->
    artifacts.add('stubifierTool', classesDir) {
        builtBy(tasks.named('compileStubifierJava'))
    }
}

dependencies {
    api project(':javacutil')
    api project(':dataflow')
    // At the moement, there are no differences between eisop and typetools stubparsers.
    api 'org.checkerframework:stubparser:3.27.1'
    stubifierImplementation 'org.checkerframework:stubparser:3.27.1'
    stubifierImplementation project(':checker-qual')
    // Lets main sourceSet code (e.g. BinaryStubData, RemoveAnnotationsForInference) compile
    // against stubifier classes. WARNING: this does not bundle those classes into framework.jar,
    // which must work standalone -- they ship only inside checker.jar's shadow jar. Main
    // sourceSet code may only reference stubifier compile-time constants (inlined by javac, so
    // no runtime dependency results) or classes that are exclusively invoked against
    // checker.jar's classpath (e.g. RemoveAnnotationsForInference's `main` method, run via
    // checker/dist/checker.jar, never via framework.jar). Never add a real (non-inlined) runtime
    // call from framework.jar-shipped code into a stubifier class.
    implementation sourceSets.stubifier.output

    /* NO-AFU
     // AFU is an "includedBuild" imported in checker-framework/settings.gradle, so the version number doesn't matter.
     // https://docs.gradle.org/current/userguide/composite_builds.html#settings_defined_composite
     api('org.checkerframework:annotation-file-utilities:*') {
     exclude group: 'com.google.errorprone', module: 'javac'
     }
     */

    api project(':checker-qual')

    // External dependencies:
    // If you add an external dependency, you must shadow its packages.
    // See the comment in ../build.gradle in the shadowJar block.
    implementation "org.plumelib:hashmap-util:${versions.hashmapUtil}"
    implementation "org.plumelib:plume-util:${versions.plumeUtil}"
    implementation "org.plumelib:reflection-util:${versions.reflectionUtil}"
    // Guava is used from main sources on unconditional code paths (SourceChecker's
    // Splitter/ImmutableSet uses and GenericAnnotatedTypeFactory's Ordering uses), so it must
    // be an `implementation` dependency: it has to appear in this artifact's POM and on
    // runtimeClasspath, which is what frameworkAllJar is built from.
    implementation "com.google.guava:guava:${versions.guava}"
    // Add this dependency if needed to debug classpath issues.
    // implementation 'io.github.classgraph:classgraph:4.8.180'

    testImplementation "junit:junit:${versions.junit}"
    testImplementation project(':framework-test')
    testImplementation sourceSets.testannotations.output

    // AutoValue support in Returns Receiver Checker
    testImplementation "com.google.auto.value:auto-value-annotations:${versions.autoValue}"
    testImplementation "com.google.auto.value:auto-value:${versions.autoValue}"

    // Lombok support in Returns Receiver Checker
    testImplementation "org.projectlombok:lombok:${versions.lombok}"
}

tasks.register('cloneAnnotatedJdk', CloneTask) {
    description = 'Obtain or update the annotated JDK.'
    url.set('https://github.com/eisop/jdk.git')
    directory.set(file(annotatedJdkHome))
    outputs.upToDateWhen { false }
}

tasks.register('copyAndMinimizeAnnotatedJdkFiles', JavaExec) {
    dependsOn 'cloneAnnotatedJdk'
    group = 'Build'
    dependsOn ':framework:compileStubifierJava'
    // we need the next two dependencies because we run JavaStubifier using this project's runtimeClasspath,
    // which refers to the jars for these other projects
    dependsOn ':javacutil:jar'
    dependsOn ':dataflow:jar'
    def inputDir = "${annotatedJdkHome}/src"
    def outputDir = layout.buildDirectory.dir('generated/resources/annotated-jdk').get().asFile

    description = "Copy annotated JDK files to ${outputDir}. Removes private and package-private methods, method bodies, comments, etc. from the annotated JDK"

    inputs.dir file(inputDir)
    outputs.dir file(outputDir)

    classpath = sourceSets.stubifier.runtimeClasspath
    standardOutput = System.out
    errorOutput = System.err

    mainClass = 'org.checkerframework.framework.stubifier.JavaStubifier'
    args outputDir

    def injectedFiles = project.objects.newInstance(InjectedFileOps)
    def inputDirFile = file(inputDir)
    def jdkHomeFile = file(annotatedJdkHome)
    def absolutejdkHome = jdkHomeFile.absolutePath

    doFirst {
        FileTree tree = injectedFiles.objects.fileTree().setDir(inputDirFile)
        Set<String> annotatedForFiles = new HashSet<>()
        // For each annotated file, also record every ancestor directory along the
        // path back up to annotatedJdkHome.  The copy's include Spec (below) uses
        // this to descend only into subtrees that actually contain an annotated
        // file, and to avoid materialising empty intermediate directories in the
        // destination.  (Copy defaults includeEmptyDirs=true, so a Spec that said
        // "yes" to every directory would create every traversed directory in the
        // output.)
        Set<String> annotatedDirs = new HashSet<>()
        tree.visit { FileVisitDetails fvd ->
            // Use relativePath.pathString, not file.path: Gradle's RelativePath always joins
            // segments with "/" regardless of platform, whereas File.path uses File.separator
            // ("\\" on Windows), which made this exclusion silently never match there --
            // pulling org/checkerframework/** (checker-qual's own vendored sources in the JDK
            // clone) into the minimized annotated JDK and its binary stub only on Windows.
            if (!fvd.file.isDirectory() && fvd.file.name.matches('.*\\.java')
            && !fvd.relativePath.pathString.contains('org/checkerframework')) {
                fvd.getFile().readLines().any { line ->
                    if (line.contains('@AnnotatedFor') || line.contains('org.checkerframework')) {
                        annotatedForFiles.add(fvd.file.absolutePath)
                        File p = fvd.file.parentFile
                        while (p != null
                                && p.absolutePath.length() >= absolutejdkHome.length()
                                && p.absolutePath.startsWith(absolutejdkHome)) {
                            if (!annotatedDirs.add(p.absolutePath)) {
                                // Already inserted -- so are all its parents up to root.
                                break
                            }
                            p = p.parentFile
                        }
                        return true
                    }
                }
            }
        }
        injectedFiles.fs.copy {
            from(jdkHomeFile)
            into(outputDir)
            // A single Spec consults the precomputed sets in O(1) per element
            // and lets Gradle prune subtrees that contain no annotated files.
            include { FileTreeElement fte ->
                fte.directory
                ? annotatedDirs.contains(fte.file.absolutePath)
                : annotatedForFiles.contains(fte.file.absolutePath)
            }
        }
    }
}

tasks.named('sourcesJar').configure { dependsOn 'copyAndMinimizeAnnotatedJdkFiles' }
tasks.named('processResources').configure { dependsOn 'copyAndMinimizeAnnotatedJdkFiles' }

tasks.register('allSourcesJar', Jar) {
    group = 'Build'
    description = 'Creates a sources jar with the sources of every class in framework-all.jar'
    destinationDirectory = file("${projectDir}/dist")
    archiveFileName = 'framework-source.jar'
    archiveClassifier = 'sources'
    from (project(':framework').sourceSets.main.java,
            project(':dataflow').sourceSets.main.allJava,
            project(':javacutil').sourceSets.main.allJava)
}

tasks.register('allJavadocJar', Jar) {
    group = 'Build'
    description = 'Creates a javadoc jar with the Javadoc of every class in framework-all.jar'
    def javadocs = [
        ':framework',
        ':dataflow',
        ':javacutil'
    ].collect {
        project(it).tasks.named('javadoc', Javadoc)
    }
    dependsOn javadocs

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    destinationDirectory = file("${projectDir}/dist")
    archiveFileName = 'framework-javadoc.jar'
    archiveClassifier = 'javadoc'
    from javadocs.collect {
        it.map { jd ->
            jd.destinationDir
        }
    }
}

tasks.named('shadowJar') {
    description = 'Creates the "fat" framework.jar in dist'
    destinationDirectory = file("${projectDir}/dist")
    archiveFileName = 'framework.jar'
    manifest {
        attributes('Automatic-Module-Name': 'org.checkerframework.framework')
    }

    minimize()
}

rootProject.createCheckTypeTask(project.name, 'CompilerMessages',
        'org.checkerframework.checker.compilermsgs.CompilerMessagesChecker')
tasks.named('checkCompilerMessages') {
    options.compilerArgs += [
        '-Apropfiles=' + sourceSets.main.resources.filter { file -> file.name.equals('messages.properties') }.asPath
    ]
}

tasks.register('loaderTests', Exec) {
    dependsOn 'shadowJar'
    group = 'Verification'
    description = 'Run tests for the annotation class loader'
    dependsOn('compileTestJava')

    // TODO: this dependency on checker is a bit ugly.
    dependsOn ':checker-qual:jar'
    dependsOn ':checker:assemble'
    commandLine 'make', '-C', 'tests/annotationclassloader/', 'all'
}

tasks.register('cleanLoaderTests', Exec) {
    description = 'Clean up after the annotation class loader tests'
    commandLine 'make', '-C', 'tests/annotationclassloader/', 'clean'
}

tasks.named('clean') {
    dependsOn 'cleanLoaderTests'

    delete('tests/returnsreceiverdelomboked')
    delete('dist')
    delete('tests/build')
}


if (skipDelombok) {
    tasks.named('test') {
        exclude '**/ReturnsReceiverLombokTest.java'
    }
} else {
    tasks.register('delombok', JavaExec) {
        description = 'Delomboks the source code tree in tests/returnsreceiverlombok'

        def srcDelomboked = 'tests/returnsreceiverdelomboked'
        def srcJava = 'tests/returnsreceiverlombok'

        inputs.files file(srcJava)
        outputs.dir file(srcDelomboked)

        // This dependency is required to ensure the checker-qual jar exists,
        // to prevent lombok from emitting "cannot find symbol" errors for @This
        // annotations in the test input code.
        dependsOn ':checker-qual:jar'

        // Run Lombok's delombok tool directly via its launcher instead of through Ant: AntBuilder
        // is not supported with the configuration cache.
        def delombokClasspath = configurations.testCompileClasspath
        classpath = delombokClasspath
        mainClass = 'lombok.launch.Main'
        args 'delombok', srcJava, '-d', srcDelomboked, '-c', delombokClasspath.asPath
    }
    tasks.named('test').configure { dependsOn 'delombok' }
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.gradle.api.component.AdhocComponentWithVariants

tasks.register('frameworkAllJar', ShadowJar) {
    dependsOn 'compileJava'
    group = 'Build'
    description = "Builds framework-all-${project.version}.jar with all dependencies except checker-qual."
    includeEmptyDirs = false
    // archiveBaseName, not `base { archivesName = ... }`: `base` resolves to the project's
    // BasePluginExtension, so setting it here renamed every archive in this subproject --
    // framework's own jar and sources jar were being written as framework-all-VERSION*.jar.
    archiveBaseName = 'framework-all'
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('shadow/frameworkAll')

    from shadowJar.source
    // runtimeClasspath, so every `implementation` dependency is bundled and relocated.
    // A dependency declared `compileOnly` would silently be left out; see the guava
    // comment in the dependencies block above.
    configurations = shadowJar.configurations
    relocators = shadowJar.getRelocators()
    // The manifest (Automatic-Module-Name, Implementation-Version, Bundle-License) comes
    // from the `tasks.withType(Jar)` block in ../build.gradle, which keys off archiveFileName.

    // checker-qual is a normal published dependency of framework-all (added to its POM in
    // configureFrameworkPom below), not bundled, so that a consumer gets one copy of the
    // qualifiers rather than a relocated duplicate.
    exclude 'org/checkerframework/**/qual/*'
    // Not inherited from the shadowJar block in ../build.gradle, which configures only the
    // task named `shadowJar`. Without it this jar ships checker-qual's module descriptor,
    // which declares `module org.checkerframework.checker.qual` and exports packages the
    // exclude above has just removed -- a module that does not describe this jar.
    exclude '**/module-info.class'
    // jsr305 comes in through guava, and its annotations on the bundled guava classes keep
    // part of it alive through minimize(). No Checker Framework class references a jsr305
    // type, so it is not API here -- and shipping it would put `javax.annotation`, a package
    // shared with JSR-250, unrelocated inside this jar. It cannot be relocated instead: the
    // Nullness Checker compares user annotations against the literal
    // "javax.annotation.Nullable", which ShadowJar would rewrite along with the package.
    dependencies {
        exclude(dependency('com.google.code.findbugs:jsr305:.*'))
    }
    minimize()
}

// `assemble` deliberately does not build frameworkAllJar: it is needed only when publishing,
// and it costs a full shadow pass. `publish`/`publishToMavenLocal` pick it up through the
// frameworkAll publication's artifact list. This mirrors the reasoning for allJavadocJar and
// allSourcesJar, which are likewise kept off `assemble`.

apply from: rootProject.file('gradle-mvn-push.gradle')

/**
 * Configures the parts of the POM that framework and framework-all share.
 *
 * @param publication the MavenPublication to configure
 * @param artifactName the artifact this publication produces, named in the description
 * @param extraDescriptionLines description lines to append, if any
 */
final configureFrameworkPom(
MavenPublication publication, String artifactName, List<String> extraDescriptionLines = []) {
    rootProject.sharedPublicationConfiguration(publication)
    publication.pom {
        description = String.join(System.lineSeparator(),
                ['The Checker Framework enhances Java\'s type system to',
                 'make it more powerful and useful. This lets software developers',
                 'detect and prevent errors in their Java programs.',
                 "The ${artifactName} artifact contains the core type checking infrastructure",
                 'and permits you to write your own compiler plug-ins.']
                + extraDescriptionLines)
        licenses {
            license {
                name = 'GNU General Public License, version 2 (GPL2), with the classpath exception'
                url = 'http://www.gnu.org/software/classpath/license.html'
                distribution = 'repo'
            }
        }
    }
}

// src/testFixtures is an internal support library: it exists so that the testchecker sources
// are shared with :checker's tests (see the java-test-fixtures comment at the top of this file).
// The java-test-fixtures plugin adds its two variants to `components.java`, which would publish
// framework-VERSION-test-fixtures.jar and reference it from the Gradle Module Metadata -- an
// artifact we do not support, invisible to Maven consumers, and describable in a POM only by
// suppressing the warning that says so. Skip both variants instead.
afterEvaluate {
    def javaComponent = components.java as AdhocComponentWithVariants
    ['testFixturesApiElements', 'testFixturesRuntimeElements'].each { name ->
        def variant = configurations.findByName(name)
        if (variant != null) {
            javaComponent.withVariantsFromConfiguration(variant) { it.skip() }
        }
    }
}

publishing {
    publications {
        // The ordinary library: the framework classes, with its dependencies declared in the
        // POM rather than bundled.
        framework(MavenPublication) {
            configureFrameworkPom(it, 'framework')
            pom.name = 'Checker Framework Core Library'
            from components.java
        }

        // The self-contained variant: one jar with every dependency bundled and relocated.
        // It has no Gradle component (its jar is assembled by frameworkAllJar rather than by
        // a configuration), so there is nothing for Gradle to derive POM dependencies from,
        // and the single dependency it does have has to be written by hand.
        frameworkAll(MavenPublication) {
            configureFrameworkPom(it, 'framework-all',
            ['Unlike the framework artifact, this artifact contains all its dependencies.'])
            pom.name = 'Checker Framework Core Library (including all dependencies)'
            artifactId = 'framework-all'
            rootProject.addCheckerQualDependencyToPom(it, version)
            artifact tasks.named('frameworkAllJar')
            artifact tasks.named('allSourcesJar')
            artifact tasks.named('allJavadocJar')
        }
    }
}

signing {
    sign publishing.publications.framework
    sign publishing.publications.frameworkAll
}
