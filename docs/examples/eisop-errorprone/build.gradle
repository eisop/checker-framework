// ///////////////////////////////////////////////////////////////////////////
// Example: run the EISOP Checker Framework as an Error Prone plugin (eisopcf).
//
// Unlike the sibling "errorprone" example (which runs the Checker Framework as a
// standalone annotation processor alongside Error Prone), this example runs the Checker
// Framework *inside* Error Prone, as the single "eisopcf" Error Prone check.
//
// Two modes, selected by the cfVersion project property (like the sibling examples):
//   * -PcfVersion=local  -- consume the locally-built jars from this checkout, so the example
//                           exercises the current development Checker Framework. This is what the
//                           examples CI job runs; the jars are built for it by the :checker:
//                           exampleTests task, so no nested Gradle build is needed here.
//   * (default)          -- consume the published io.github.eisop artifacts from Maven Central.
//                           This will fail until framework-errorprone has its first release.
// See docs/developer/cf-errorprone.md.
//

plugins {
    id 'java'
    id 'net.ltgt.errorprone' version '5.1.0'
}

repositories {
    mavenCentral()
}

// Released version to consume in the default (non-local) mode, kept in step with the sibling
// examples. Of the artifacts below, only framework-errorprone is missing at this version: that
// mode therefore fails until the first release that includes framework-errorprone, after which
// bumping this to that release makes it work.
def eisopVersion = '3.49.5-eisop1'

boolean useLocal = findProperty('cfVersion') == 'local'

// The Checker Framework repository root (this example lives at docs/examples/eisop-errorprone).
def cfRoot = rootProject.file('../../..')

// Locate a locally-built jar by name prefix, tolerating the exact version string.  The
// :checker:exampleTests task builds these before invoking make/Gradle.  When 'shaded' is false,
// the plain (non-shadow) jar is selected -- the framework-errorprone plugin must NOT be the
// "-all" shadow jar, which bundles a copy of Error Prone's classes and breaks the BugChecker
// service check ("not a subtype").
def cfJar = { String dir, String prefix, boolean shaded = false ->
    def libs = file("${cfRoot}/${dir}/build/libs")
    def match = libs.listFiles()?.findAll {
        boolean base =
                it.name.startsWith(prefix)
                        && it.name.endsWith('.jar')
                        && !it.name.contains('sources')
                        && !it.name.contains('javadoc')
        boolean isAll = it.name.endsWith('-all.jar')
        return base && (shaded == isAll)
    }
    if (match == null || match.isEmpty()) {
        throw new GradleException(
                "Could not find the expected ${prefix}*.jar in ${libs}. It is built by the"
                        + " :checker:exampleTests task; to build it directly run, from the"
                        + " repository root: ./gradlew :checker-qual:jar :framework-errorprone:jar"
                        + " :checker:shadowJar")
    }
    return match[0]
}

dependencies {
    if (useLocal) {
        // Annotations used by the demo source (e.g. @Nullable).
        compileOnly files(cfJar('checker-qual', 'checker-qual-'))

        // Error Prone itself, the eisopcf plugin, and the Checker Framework checkers to run, all
        // on the errorprone (annotation processor) path.  The plugin resolves the selected checker
        // class by name at run time from this path.
        errorprone "com.google.errorprone:error_prone_core:2.50.0"
        // The plain (non-shadow) plugin jar.
        errorprone files(cfJar('framework-errorprone', 'framework-errorprone-', false))
        // The checker "-all" shadow jar bundles all Checker Framework checkers.
        errorprone files(cfJar('checker', 'checker-', true))
    } else {
        // Annotations used by the demo source (e.g. @Nullable).
        compileOnly "io.github.eisop:checker-qual:${eisopVersion}"

        // Error Prone itself, the published eisopcf plugin, and the Checker Framework checkers to
        // run, all on the errorprone (annotation processor) path.
        errorprone "com.google.errorprone:error_prone_core:2.50.0"
        errorprone "io.github.eisop:framework-errorprone:${eisopVersion}"
        errorprone "io.github.eisop:checker:${eisopVersion}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.enabled = true
    // Select the Checker Framework type system(s) to run as the eisopcf check.  Add more,
    // comma-separated, to run several type systems over the one compilation.
    options.errorprone.option(
            'eisopcf:checkers',
            'org.checkerframework.checker.nullness.NullnessChecker')

    // Checker Framework options are passed with javac -A, exactly as in standalone mode (NOT via
    // -XepOpt).  Both common options and checker-specific options (-ACheckerName_option=...) work.
    // Examples (commented out so this example still reports its demo error):
    //   options.compilerArgs += ['-Astubs=/path/to/my.astub']
    //   options.compilerArgs += ['-AsuppressWarnings=nullness']   // would suppress the demo error
    //   options.compilerArgs += ['-ANullnessChecker_someOption=value']

    // javac options Error Prone (and the Checker Framework) require.
    options.compilerArgs += [
        '-XDcompilePolicy=simple',
        '--should-stop=ifError=FLOW',
        '-XDaddTypeAnnotationsToSymbol=true',
    ]

    // The Checker Framework and Error Prone reach into javac internals.
    options.fork = true
    options.forkOptions.jvmArgs += [
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
        '--add-opens', 'jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
    ]
}
