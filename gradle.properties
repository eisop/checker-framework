# Gradle will fork up to org.gradle.workers.max JVMs to execute tasks in parallel.
# (The default value of org.gradle.workers.max is the number of CPU processors.)
org.gradle.parallel=true

# Heap notes:
#  * 2g was tight for this build:  Error Prone + a forked javac + many subprojects
#    being configured/compiled in parallel routinely came close to the limit.
#  * HeapDumpOnOutOfMemoryError makes it possible to diagnose OOMs in CI without
#    having to reproduce them locally.
# If you are running CI on memory-constrained agents (< 4 GB available to the
# daemon), drop -Xmx back to 2g or 3g; the build will work, just more slowly.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true

# Reuse the result of the configuration phase across builds when nothing that
# affects configuration has changed.
org.gradle.configuration-cache=true

# Versions of the libraries that the build depends on.  They are project properties, so the
# build files refer to them as "${junitVersion}" and so on.
#
# If you update errorproneVersion (https://mvnrepository.com/artifact/com.google.errorprone/error_prone_core):
#  * Temporarily comment out "-Werror" in build.gradle files.
#  * Repeatedly run `./gradlew clean compileJava` and fix all errors.
#  * Uncomment "-Werror".
#
# Google Java Format requires JDK 17 or higher as of version 1.25.0.
#
# plume-util includes a version of reflection-util.  When updating, ensure the versions are consistent.

autoValueVersion=1.11.1
errorproneVersion=2.50.0
googleJavaFormatVersion=1.35.0
guavaVersion=33.7.1-jre
hashmapUtilVersion=0.0.1
junitVersion=4.13.2
lombokVersion=1.18.48
plumeUtilVersion=1.11.0
reflectionUtilVersion=1.1.6
