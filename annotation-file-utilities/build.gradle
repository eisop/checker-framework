plugins {
    id("java-library")
    id("base")
}


java {
    // This test is for whether the Checker Framework runs under Java 8.
    // Currently, the Checker Framework does run under Java 8.
    if (true /* runs under Java 8 */) {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    } else {
        sourceCompatibility = 11
        targetCompatibility = 11
    }
}

// The Annotation File Utilities are kept close to typetools' copy, which does not use Modernizer.
afterEvaluate {
    // After the root build.gradle configures Modernizer.
    modernizer {
        failOnViolations = false
    }
}

dependencies {
    // Annotations in checker-qual.jar are used, but no checkers are (currently) run on the code.
    compileOnly(project(":checker-qual"))

    implementation(libs.options)
    implementation(libs.plume.util)
    implementation(libs.reflection.util)
    implementation(libs.guava) {
        // So long as Guava only uses annotations from checker-qual, excluding it should not cause problems.
        exclude group: "org.checkerframework"
    }
    implementation(libs.asm)
    testImplementation(libs.junit)
    testImplementation(project(":checker-qual"))
}


// The scripts in bin/ put javac on the bootclasspath on JDK 8, from lib/.
tasks.register("copyJavacJar", Copy) {
    description = "Copies the javac jar that the scripts in bin/ use on JDK 8 into lib/."
    from(configurations.javacJar)
    into("${projectDir}/lib")
}

shadowJar {
    destinationDirectory = file("${projectDir}/dist")
    includeEmptyDirs = false
    archiveFileName = "annotation-file-utilities-all.jar"
    // Don't include any class from the Checker Framework.
    // This should just be checker-qual.
    exclude("org/checkerframework/checker/**")
    exclude("org/checkerframework/framework/**")
    exclude("org/checkerframework/dataflow/**")
}

// Shadowing Test Sources and Dependencies

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

import java.nio.file.Files

tasks.register("skinnyJar", ShadowJar) {
    dependsOn(compileJava)
    description = "Builds annotation-file-utilities.jar with only scene-lib and annotation-file-utilities classes."
    includeEmptyDirs = false
    destinationDirectory = file("${projectDir}/dist")
    archiveFileName = "annotation-file-utilities.jar"
    // A ShadowJar task other than the plugin's own shadowJar has no input by default.
    from(sourceSets.main.output)
    include("org/checkerframework/afu/scenelib/**/*.class")
    include("org/checkerframework/afu/annotator/**/*.class")
}

tasks.register("testExample", JavaExec) {
    group = "Verification"
    dependsOn(compileTestJava)
    description = "Run the scene-lib example test."

    String outputDir = "${layout.buildDirectory.get()}/example-test/"
    String resourceDir = "${projectDir}/src/test/resources/annotations/tests/executable/"

    classpath = files(sourceSets.test.java.classesDirectory)
    classpath += sourceSets.test.compileClasspath
    mainClass = "org.checkerframework.afu.scenelib.test.executable.Example"

    args = [
        "${resourceDir}/example-input.jaif",
        "foo.Bar",
        "${outputDir}/example-output.jaif"
    ]

    doFirst {
        new File(outputDir).mkdirs()
        new File("${outputDir}/example-stdout.jaif").createNewFile()

        standardOutput = new FileOutputStream("${outputDir}/example-stdout.jaif")
    }
    doLast {

        byte[] goalJaif = Files.readAllBytes(new File(resourceDir, "example-output.jaif.goal").toPath())
        byte[] outputJaif = Files.readAllBytes(new File(outputDir, "example-output.jaif").toPath())
        if (!Arrays.equals(goalJaif, outputJaif)) {
            throw new GradleException("In ${outputDir}, file example-output.jaif does not match goal.")
        }

        byte[] goalStdOut = Files.readAllBytes(new File(resourceDir, "example-stdout.jaif.goal").toPath())
        byte[] stdOut = Files.readAllBytes(new File(outputDir, "example-stdout.jaif").toPath())
        if (!Arrays.equals(goalStdOut, stdOut)) {
            throw new GradleException("In ${outputDir}, file example-stdout.jaif does not match goal.")
        }
    }
}

tasks.register("testAnnotator", Exec) {
    dependsOn(shadowJar)
    description = "Run the annotator test."
    group = "Verification"
    workingDir = "${projectDir}/tests/"
    executable = "make"
}

tasks.register("cleanTestAnnotator", Exec) {
    description = "Clean the annotator test."
    workingDir = "tests/"
    executable = "make"
    args("clean")
}

clean {
    dependsOn(cleanTestAnnotator)
    delete("dist/annotation-file-utilities.jar", "dist/annotation-file-utilities-all.jar", "annotation-file-utilities.zip")
}

test.dependsOn(testExample)
test.dependsOn(testAnnotator)

tasks.register("updateUserOptions") {
    dependsOn(
            "updateUserOptionsJavadoc",
            "updateUserOptionsHtml"
            )
}

/**
 * Creates a task that runs plume-lib's OptionsDoclet, which rewrites the documentation of the
 * annotator's command-line options in a docfile, between its "options doc" markers.
 *
 * @param taskName the name of the task to create
 * @param taskDescription description of the task
 * @param docfile the file to rewrite
 * @param format the format of the documentation: "javadoc" or "html"
 * @return the new task
 */
def createUpdateUserOptionsTask(taskName, taskDescription, docfile, format) {
    tasks.register(taskName, Javadoc) {
        description = taskDescription

        // Only the annotator's options, not those of scene-lib's ClassFileReader and
        // ClassFileWriter.
        source = sourceSets.main.java
        exclude("org/checkerframework/afu/scenelib/io/classfile/**")
        classpath = project.sourceSets.main.compileClasspath + project.sourceSets.main.runtimeClasspath
        options.memberLevel = JavadocMemberLevel.PRIVATE
        options.docletpath = project.sourceSets.main.runtimeClasspath as List
        // With this doclet, the root build.gradle adds no taglet, which OptionsDoclet does not
        // accept, and keeps the member level.
        options.doclet = "org.plumelib.options.OptionsDoclet"
        // OptionsDoclet 2 needs the doclet API of JDK 9 and later, and javadoc from JDK 25 on
        // fails with "AssertionError: ignored flag: -Xlint:-options".
        def jdkVersion = useJdkVersionInt
        doFirst {
            if (jdkVersion < 9 || jdkVersion > 24) {
                throw new GradleException(
                        "${taskName} needs JDK 9 to 24, but uses JDK ${jdkVersion}; run it with -PuseJdkVersion=21.")
            }
        }
        // OptionsDoclet loads the annotator's classes, which use javac internals.
        if (!isJava8) {
            options.jFlags(*compilerArgsForRunningCF)
        }
        options.addStringOption("docfile", docfile)
        options.addStringOption("format", format)
        options.addStringOption("i", "-quiet")
        options.noTimestamp(false)
        title = ""
        // Not the javadoc task's directory: OptionsDoclet writes nothing here.
        destinationDir = layout.buildDirectory.dir("docs/${taskName}").get().asFile

        // The result is the rewritten docfile, which is not a task output, so always run the
        // task and never take it from the build cache.
        outputs.upToDateWhen { false }
        outputs.doNotCacheIf("The result is the docfile, which is rewritten in place") { true }
    }
}

createUpdateUserOptionsTask("updateUserOptionsJavadoc",
        "Updates documentation of command-line arguments in Javadoc.",
        file("src/main/java/org/checkerframework/afu/annotator/Main.java").path, "javadoc")
createUpdateUserOptionsTask("updateUserOptionsHtml",
        "Updates documentation of command-line arguments in the manual.",
        rootProject.file("docs/annotation-file-utilities/annotation-file-utilities.html").path, "html")

tasks.named("assemble") {
    dependsOn(shadowJar)
    dependsOn(skinnyJar)
    dependsOn(copyJavacJar)
}

apply from: rootProject.file("gradle-mvn-push.gradle")

/** Adds information to the publication for uploading to Maven repositories. */
final annotationFileUtilitiesPom(publication) {
    rootProject.sharedPublicationConfiguration(publication)
    publication.from(components.java)
    publication.pom {
        name = "Annotation File Utilities"
        description = "The Annotation File Utilities read, write, and insert annotations in Java " +
                "source and class files, and manipulate annotation files (\".jaif\" files)."
        licenses {
            license {
                name = "The MIT License"
                url = "https://opensource.org/licenses/MIT"
                distribution = "repo"
            }
        }
    }
}

publishing {
    publications {
        annotationFileUtilities(MavenPublication) {
            annotationFileUtilitiesPom(it)
        }
    }
}

signing {
    sign(publishing.publications.annotationFileUtilities)
}
